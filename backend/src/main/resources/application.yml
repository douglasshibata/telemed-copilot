server:
  port: 8080

spring:
  application:
    name: telemed-copilot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:telemeddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: ${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

jitsi:
  app-id: ${JITSI_APP_ID:telemed-copilot}
  secret: ${JITSI_APP_SECRET:telemed_jwt_secret_key_32bytes_long!!}
  domain: ${JITSI_DOMAIN:meet.jit.si}
  token-validity-seconds: 7200
