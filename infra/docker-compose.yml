services:
  postgres:
    image: postgres:16-alpine
    container_name: telemed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemed_db}
      POSTGRES_USER: ${POSTGRES_USER:-telemed_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemed_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telemed_user} -d ${POSTGRES_DB:-telemed_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telemed-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: telemed-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "61613:61613" # STOMP
      - "15674:15674" # Web STOMP
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: telemed-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  jitsi-web:
    image: jitsi/web:stable-9457
    container_name: telemed-jitsi-web
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8088:80"
    environment:
      ENABLE_AUTH: 1
      ENABLE_GUEST: 0
      AUTH_TYPE: jwt
      JWT_APP_ID: ${JITSI_APP_ID:-telemed-copilot}
      JWT_APP_SECRET: ${JITSI_APP_SECRET:-telemed_jwt_secret_key_32bytes_long!!}
      PUBLIC_URL: https://localhost:8443
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
